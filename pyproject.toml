[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-agent"
version = "0.1.0"
description = "Autonomous Incident Investigation & Remediation Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mindfire Solutions", email = "subhranshus@mindfiresolutions.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "alembic>=1.13.1",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "qdrant-client>=1.8.0",
    "prometheus-client>=0.20.0",
    "langgraph>=0.0.30",
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-groq>=0.1.9",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "fastembed>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.3",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "UP046", # allow Generic[ModelType] for typing compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore:.*UNPROCESSABLE_ENTITY.*",
]
