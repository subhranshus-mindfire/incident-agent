services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: incident_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incident_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incident-network

  ollama:
    image: ollama/ollama:latest
    container_name: incident-agent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - incident-network

  redis:
    image: redis:7-alpine
    container_name: incident-agent-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incident-network

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: incident-agent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incident-network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: incident-agent-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incident-network

  loki:
    image: grafana/loki:2.9.6
    container_name: incident-agent-loki
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incident-network

  payment-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-agent-payment-api
    restart: unless-stopped
    command: ["uvicorn", "simulation.services.payment_api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      - LOKI_URL=http://loki:3100
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./simulation:/workspace/simulation
    networks:
      - incident-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-agent-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Incident Investigation Agent
      - APP_VERSION=0.1.0
      - ENVIRONMENT=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/incident_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PROMETHEUS_URL=http://prometheus:9090
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - LOKI_URL=http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ./app:/workspace/app
      - ./simulation:/workspace/simulation
      - ./tests:/workspace/tests
      - ./migrations:/workspace/migrations
      - ./pyproject.toml:/workspace/pyproject.toml
      - fastembed_cache:/home/appuser/.cache/fastembed
    networks:
      - incident-network

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-agent-test
    profiles:
      - test
    environment:
      - ENVIRONMENT=test
      - PYTHONPATH=/workspace
    volumes:
      - ./app:/workspace/app
      - ./simulation:/workspace/simulation
      - ./ui:/workspace/ui
      - ./tests:/workspace/tests
      - ./pyproject.toml:/workspace/pyproject.toml
    command: ["pytest", "-v", "tests/"]
    networks:
      - incident-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-agent-ui
    restart: unless-stopped
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - AGENT_API_URL=http://app:8000
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - PAYMENT_API_URL=http://payment-api:8080
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./ui:/workspace/ui
      - ./simulation:/workspace/simulation
    networks:
      - incident-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  loki_data:
  ollama_data:
  fastembed_cache:

networks:
  incident-network:
    driver: bridge
