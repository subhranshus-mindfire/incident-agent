services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: incident_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incident_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incident-network

  redis:
    image: redis:7-alpine
    container_name: incident-agent-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incident-network

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: incident-agent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - incident-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-agent-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Incident Investigation Agent
      - APP_VERSION=0.1.0
      - ENVIRONMENT=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/incident_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./pyproject.toml:/workspace/pyproject.toml
      - ./migrations:/workspace/migrations
      - ./pyproject.toml:/workspace/pyproject.toml
    networks:
      - incident-network

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-agent-test
    profiles:
      - test
    environment:
      - ENVIRONMENT=test
      - PYTHONPATH=/workspace
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./pyproject.toml:/workspace/pyproject.toml
    command: ["pytest", "-v", "tests/"]
    networks:
      - incident-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  incident-network:
    driver: bridge
