name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  security-audit:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and pip-audit
        run: |
          pip install uv
          uv pip install --system pip-audit

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt

  static-analysis:
    name: Lint, Format & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dev tools
        run: |
          pip install uv
          uv pip install --system ruff mypy -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check app tests

      - name: Run Ruff Format Check
        run: ruff format --check app tests

      - name: Run Mypy Static Type Checker
        run: mypy --config-file=pyproject.toml app

  semgrep-scan:
    name: Semgrep Custom Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

  test-suite:
    name: Automated Containerized Tests
    runs-on: ubuntu-latest
    needs: [static-analysis]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Run Docker Tests
        run: docker compose run --rm test
