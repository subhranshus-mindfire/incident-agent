global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "incident-agent-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]

  - job_name: "payment-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["payment-api:8080"]
